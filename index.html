<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intellecta - AI Бизнес решения от ново поколение</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0F172A;
            --primary-light: #1E293B;
            --accent: #10B981;
            --accent-hover: #059669;
            --bg-light: #F8FAFC;
            --border-color: #E2E8F0;
            --text-dark: #0F172A;
            --text-muted: #64748B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #FFFFFF;
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Навигация */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .verified-badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94A3B8;
            border: 1px solid #E2E8F0;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .nav-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            opacity: 0.9;
        }

        /* Главен банер */
        .hero {
            text-align: center;
            padding: 80px 5% 60px 5%;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 42px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -1px;
            margin-bottom: 24px;
            color: var(--primary);
        }

        .hero p {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 40px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        /* PDF Скенер Зона */
        .dropzone-container {
            max-width: 600px;
            margin: 0 auto 80px auto;
            padding: 0 20px;
        }

        .dropzone {
            border: 2px dashed #CBD5E1;
            background-color: var(--bg-light);
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--accent);
            background-color: #F0FDF4;
        }

        .dropzone-icon {
            font-size: 40px;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: inline-block;
        }

        .dropzone h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .dropzone p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Резултат от сканиране */
        .result-box {
            display: none;
            margin-top: 20px;
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            text-align: left;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .status-badge {
            background-color: #FEE2E2;
            color: #EF4444;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .risk-item {
            background-color: #FFFBEB;
            border-left: 4px solid #F59E0B;
            padding: 12px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 10px;
            font-size: 14px;
        }

        /* Табло за управление (Дашборд) - Скрита секция по подразбиране */
        .dashboard-section {
            display: none;
            background-color: var(--bg-light);
            border-top: 1px solid var(--border-color);
            padding: 60px 5%;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .db-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .db-title h2 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .client-badge {
            background-color: #E2E8F0;
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
        }

        /* Грид Карти за управление */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .module-card {
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .module-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
        }

        .mod-contract::before { background-color: #10B981; }
        .mod-db::before { background-color: #3B82F6; }
        .mod-finance::before { background-color: #F59E0B; }

        .module-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .module-card h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .module-card p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Скрити разгъващи се панели под модулите */
        .hidden-panel {
            display: none;
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1
